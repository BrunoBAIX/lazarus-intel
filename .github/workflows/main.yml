name: Build Lazarus macOS Intel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-mac-intel:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python 3.11 Intel (x86_64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Estrai cartelle citta e mappe da assets.zip
        run: |
          python -c "
          import zipfile, os
          with zipfile.ZipFile('assets.zip', 'r') as z:
              for member in z.infolist():
                  target = member.filename.replace('\\\\', '/')
                  if target.endswith('/'):
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target) or '.', exist_ok=True)
                      with open(target, 'wb') as f:
                          f.write(z.read(member))
          "

      - name: Installa Pygame, Pillow e PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: pygame pillow pyinstaller

      - name: Converti icona.ico in icona.icns
        run: |
          python -c "from PIL import Image; img = Image.open('icona.ico'); img.save('icona.icns')"

      - name: Compila Lazarus.app per Mac Intel (x86_64)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Lazarus" \
            --target-arch x86_64 \
            --icon "icona.icns" \
            --add-data "menu_config.json:." \
            --add-data "descrizioni.json:." \
            --add-data "sfondo.jpg:." \
            --add-data "mappa.png:." \
            --add-data "font_lazarus.ttf:." \
            --add-data "musica.mp3:." \
            --add-data "citta:citta" \
            --add-data "mappe:mappe" \
            main.py
          mkdir -p dist/Lazarus.app/Contents/Resources/puntate

      - name: Smoke Test avvio Lazarus.app
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./dist/Lazarus.app/Contents/MacOS/Lazarus > test_output.log 2>&1 &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            echo "SUCCESSO: Lazarus si e' avviato ed e' rimasto attivo senza crash!"
            kill $PID
            cat test_output.log
          else
            echo "ERRORE: Lazarus e' andato in crash all'avvio!"
            cat test_output.log
            exit 1
          fi

      - name: Comprimi e carica eseguibile Mac Intel finito
        run: |
          cd dist
          zip -r -y Lazarus_macOS.zip Lazarus.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lazarus-macOS-Intel
          path: dist/Lazarus_macOS.zip
